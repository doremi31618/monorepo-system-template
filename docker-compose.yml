services:
  web:
    container_name: app-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    working_dir: /monorepo
    environment:
      VITE_API_BASE_URL: http://localhost:3333/v1
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web:/monorepo/apps/web
      - ./packages:/monorepo/packages
      - /monorepo/node_modules
    command: sh -c "bun run build:packages && bun run dev:web -- --host 0.0.0.0 --strictPort"
    depends_on:
      - api

  api:
    container_name: app-api
    env_file:
      - path: ./apps/api/.env
        required: false
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    working_dir: /monorepo
    ports:
      - '3333:3333'
    volumes:
      - ./apps/api:/monorepo/apps/api
      - ./packages:/monorepo/packages
      - /monorepo/node_modules
    environment:
      NODE_ENV: dev
      DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      API_BASE_URL: http://localhost:3333
      FRONTEND_URL: http://localhost:5173
      SMTP_HOST: smtp.example.com
      SMTP_PORT: '465'
      SMTP_USER: your-smtp-user
      SMTP_PASS: your-smtp-password
      SMTP_FROM: no-reply@example.com
      ROOT_ADMIN_EMAIL: admin@example.com
      ROOT_ADMIN_NAME: System Administrator
      ROOT_ADMIN_PASSWORD: change-me-admin-password
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: r3-assets
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_FORCE_PATH_STYLE: 'true'
    command: sh -c "bun run build:packages && bun run dev:api"
    depends_on:
      - db
      - minio
      - createbuckets

  minio:
    image: minio/minio
    container_name: app-minio
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; do echo 'Waiting for MinIO to be ready...'; sleep 1; done;
      /usr/bin/mc mb --ignore-existing myminio/r3-assets;
      /usr/bin/mc anonymous set download myminio/r3-assets;
      exit 0;
      "

  db:
    image: postgres:16-alpine
    container_name: app-db
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
  minio_data:
